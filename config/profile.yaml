# Your applicant profile. It is imported into the database on first run (`hunt init`)
# and edited from the dashboard afterwards (Profile & Onboarding). Fields left null
# are collected during onboarding. Values here are used verbatim in applications:
# never put anything here that is not true.
#
# Keep your real details out of git: copy this file to config/profile.local.yaml
# (git-ignored) and edit that copy. It takes precedence when present.
identity:
  first_name: Jane
  last_name: Doe
  preferred_name: null
  pronouns: null

contact:
  email: jane.doe@example.com
  phone: null                  # stored encrypted when HUNT_SECRET_KEY is set
  linkedin_url: null
  github_url: null
  portfolio_url: null
  address_line1: null          # encrypted
  city: null
  state: null
  postal_code: null
  country: United States

education:
  current_school: Example State University
  current_degree: Bachelor of Science in Computer Science
  current_major: Computer Science
  degree_level: Bachelor's     # Bachelor's / Master's / PhD
  expected_graduation: May 2028
  expected_graduation_date: 2028-05-15
  current_gpa: null
  undergrad_school: null       # if your current degree is a graduate one
  undergrad_degree: null
  undergrad_gpa: null
  undergrad_graduation: null

# Answered honestly in every application, and used to screen out postings you
# are not eligible for. Students on F-1 visas: CPT/OPT authorize internships,
# but most forms still count them as needing sponsorship.
work_authorization:
  visa_status: null            # e.g. US citizen, Permanent resident, F-1
  us_citizen: null
  permanent_resident: null
  authorized_to_work_us: null
  requires_sponsorship_now_or_future: null
  cpt_eligible: null
  opt_eligible: null
  will_use_opt: null
  security_clearance: false
  # Must be confirmed in the dashboard before any automatic submission.
  confirmed: false

availability:
  internship_term: Summer 2027
  earliest_start_date: null
  latest_end_date: null
  willing_to_relocate: true
  preferred_locations: []
  open_to_remote: true

preferences:
  how_did_you_hear: Online job board
  min_hourly_rate: null

# Additional skills you genuinely have that are not on the master resume.
# Tailoring may use these (they are treated as verified because you entered them).
confirmed_extra_skills: []

# Self-identification (EEO) questions are voluntary. Policy options:
#   ask      - stop and ask you whenever a required EEO question appears
#   decline  - answer "I don't wish to answer" / "Decline to self-identify"
eeo:
  policy: ask
  gender: null
  race_ethnicity: null
  hispanic_latino: null
  veteran_status: null
  disability_status: null

attestations:
  is_over_18: null
  has_relatives_at_employer: null
  subject_to_noncompete: null
